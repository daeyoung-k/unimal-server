<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원 상세 · Stomap Admin', ~{::style})}">
    <style>
        .grid {
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(320px, 0.8fr);
            gap: 18px;
            align-items: start;
        }

        .profile-image {
            width: 180px;
            max-width: 100%;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #f9fafb;
        }

        .action-list {
            display: grid;
            gap: 12px;
        }

        .action-form {
            display: grid;
            gap: 8px;
            padding: 12px;
            border: 1px solid var(--line-soft);
            border-radius: 8px;
            background: #fcfcfd;
        }

        /* 운영 로그는 값이 길어 줄바꿈이 잦다. 공통 규칙보다 촘촘하게. */
        .panel table th,
        .panel table td {
            padding: 12px 10px;
            vertical-align: top;
            font-size: 13px;
        }

        .log-image-preview {
            display: block;
            width: 88px;
            height: 88px;
            margin-bottom: 8px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #f9fafb;
            object-fit: cover;
        }

        .log-value-text {
            display: block;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.4;
            word-break: break-all;
        }

        @media (max-width: 920px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="shell">
    <th:block th:replace="~{fragments/layout :: sidebar('members')}"></th:block>

    <main class="content">
        <div class="topbar align-start">
            <div>
                <h1>회원 상세</h1>
                <div class="empty-value" th:text="${member.email}">member@unimal.co.kr</div>
            </div>
            <a class="back-link" th:href="@{/members}">목록</a>
        </div>

        <div class="grid">
            <section class="panel">
                <h2>회원 정보</h2>
                <dl class="info-list">
                    <dt>ID</dt>
                    <dd th:text="${member.id ?: '-'}">1</dd>
                    <dt>이메일</dt>
                    <dd th:text="${member.email}">member@unimal.co.kr</dd>
                    <dt>닉네임</dt>
                    <dd th:text="${member.nickname ?: '-'}">닉네임</dd>
                    <dt>이름</dt>
                    <dd th:text="${member.name ?: '-'}">이름</dd>
                    <dt>가입 방식</dt>
                    <dd th:text="${member.provider ?: '-'}">KAKAO</dd>
                    <dt>상태</dt>
                    <dd th:text="${member.status.description}">활성화</dd>
                    <dt>전화번호</dt>
                    <dd th:text="${member.tel ?: '-'}">-</dd>
                    <dt>성별</dt>
                    <dd th:text="${member.gender ?: '-'}">-</dd>
                    <dt>생일</dt>
                    <dd th:text="${member.birthday != null ? #temporals.format(member.birthday, 'yyyy-MM-dd') : '-'}">-</dd>
                    <dt>가입일</dt>
                    <dd th:text="${member.createdAt != null ? #temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">-</dd>
                    <dt>수정일</dt>
                    <dd th:text="${member.updatedAt != null ? #temporals.format(member.updatedAt, 'yyyy-MM-dd HH:mm') : '-'}">-</dd>
                    <dt>탈퇴일</dt>
                    <dd th:text="${member.withdrawalAt != null ? #temporals.format(member.withdrawalAt, 'yyyy-MM-dd HH:mm') : '-'}">-</dd>
                    <dt>프로필 이미지</dt>
                    <dd>
                        <img class="profile-image"
                             th:if="${member.profileImage != null}"
                             th:src="${member.profileImage}"
                             alt="프로필 이미지">
                        <span class="empty-value" th:if="${member.profileImage == null}">없음</span>
                    </dd>
                    <dt>소개글</dt>
                    <dd th:text="${member.introduction ?: '-'}">소개글</dd>
                </dl>
            </section>

            <section class="panel">
                <h2>운영 조치</h2>
                <div class="action-list">
                    <form class="action-form"
                          th:if="${member.profileImage != null}"
                          method="post"
                          th:action="@{/members/{id}/actions/reset-profile-image(id=${member.id})}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <label for="reset-profile-image-reason">사유</label>
                        <input id="reset-profile-image-reason" name="reason" maxlength="500" required placeholder="부적절한 프로필 이미지">
                        <button class="action-button warning" type="submit">프로필 이미지 초기화</button>
                    </form>

                    <form class="action-form"
                          th:if="${member.introduction != null}"
                          method="post"
                          th:action="@{/members/{id}/actions/hide-introduction(id=${member.id})}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <label for="hide-introduction-reason">사유</label>
                        <input id="hide-introduction-reason" name="reason" maxlength="500" required placeholder="부적절한 소개글">
                        <button class="action-button warning" type="submit">소개글 숨김</button>
                    </form>

                    <form class="action-form"
                          th:if="${member.status.name() != 'BLOCK' and member.status.name() != 'WITHDRAWAL'}"
                          method="post"
                          th:action="@{/members/{id}/actions/block(id=${member.id})}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <label for="block-member-reason">사유</label>
                        <input id="block-member-reason" name="reason" maxlength="500" required placeholder="반복 신고 누적">
                        <button class="action-button danger" type="submit">회원 차단</button>
                    </form>

                    <form class="action-form"
                          th:if="${member.status.name() == 'BLOCK'}"
                          method="post"
                          th:action="@{/members/{id}/actions/unblock(id=${member.id})}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <label for="unblock-member-reason">사유</label>
                        <input id="unblock-member-reason" name="reason" maxlength="500" required placeholder="오조치 복구">
                        <button class="action-button" type="submit">차단 해제</button>
                    </form>
                </div>
            </section>
        </div>

        <section class="panel" style="margin-top: 18px;">
            <h2>운영 로그</h2>
            <table th:if="${!actionLogs.isEmpty()}">
                <thead>
                <tr>
                    <th>일시</th>
                    <th>관리자</th>
                    <th>조치</th>
                    <th>사유</th>
                    <th>이전 값</th>
                    <th>변경 값</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="log : ${actionLogs}">
                    <td th:text="${#temporals.format(log.createdAt, 'yyyy-MM-dd HH:mm')}">-</td>
                    <td th:text="${log.adminLoginId}">admin</td>
                    <td th:text="${log.actionType.description}">조치</td>
                    <td th:text="${log.reason}">사유</td>
                    <td>
                        <div th:if="${log.actionType.name() == 'PROFILE_IMAGE_RESET' and log.beforeValue != null}">
                            <img class="log-image-preview"
                                 th:src="${log.beforeValue}"
                                 alt="운영 조치 전 이미지">
                            <span class="log-value-text" th:text="${log.beforeValue}">https://cdn.unimal.co.kr/profile/member.png</span>
                        </div>
                        <span th:unless="${log.actionType.name() == 'PROFILE_IMAGE_RESET' and log.beforeValue != null}"
                              th:text="${log.beforeValue ?: '-'}">-</span>
                    </td>
                    <td th:text="${log.afterValue ?: '-'}">-</td>
                </tr>
                </tbody>
            </table>
            <div class="empty-value" th:if="${actionLogs.isEmpty()}">아직 운영 로그가 없습니다.</div>
        </section>
    </main>
</div>
</body>
</html>
