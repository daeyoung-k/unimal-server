<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stomap Admin Members</title>
    <style>
        :root {
            --bg: #f6f7f9;
            --surface: #ffffff;
            --surface-strong: #111827;
            --text: #172033;
            --muted: #667085;
            --line: #dde3eb;
            --line-soft: #eef2f6;
            --primary: #2563eb;
            --primary-soft: #e8f0ff;
            --success: #047857;
            --danger: #b42318;
            --warning: #b54708;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .shell {
            display: grid;
            grid-template-columns: 240px minmax(0, 1fr);
            min-height: 100vh;
        }

        aside {
            background: var(--surface-strong);
            color: #f9fafb;
            padding: 24px 18px;
        }

        .brand {
            margin-bottom: 28px;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0;
        }

        nav {
            display: grid;
            gap: 6px;
        }

        nav a {
            display: flex;
            align-items: center;
            min-height: 40px;
            padding: 0 12px;
            border-radius: 6px;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        nav a.active {
            background: #1f2937;
            color: #ffffff;
        }

        .content {
            min-width: 0;
            padding: 28px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 22px;
        }

        h1 {
            margin: 0;
            font-size: 26px;
            letter-spacing: 0;
        }

        .summary {
            margin-top: 6px;
            color: var(--muted);
            font-size: 14px;
        }

        .logout {
            height: 38px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--surface);
            color: #344054;
            padding: 0 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .table-panel {
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--line-soft);
            text-align: left;
            vertical-align: middle;
            font-size: 14px;
        }

        th {
            background: #f9fafb;
            color: #475467;
            font-size: 12px;
            font-weight: 800;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        .member-main {
            display: grid;
            gap: 3px;
        }

        .member-name {
            color: #101828;
            font-weight: 800;
        }

        .member-meta {
            color: var(--muted);
            font-size: 12px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            min-height: 26px;
            padding: 0 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
        }

        .status.ACTIVE {
            background: #ecfdf3;
            color: var(--success);
        }

        .status.INACTIVE,
        .status.WITHDRAWAL {
            background: #f2f4f7;
            color: #475467;
        }

        .status.BLOCK {
            background: #fef3f2;
            color: var(--danger);
        }

        .status.RESIGNIN {
            background: #fffaeb;
            color: var(--warning);
        }

        .empty {
            padding: 56px 16px;
            color: var(--muted);
            text-align: center;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            padding: 14px 16px;
            border-top: 1px solid var(--line-soft);
            background: #fcfcfd;
        }

        .page-link,
        .page-current {
            display: inline-flex;
            align-items: center;
            min-height: 34px;
            border-radius: 6px;
            padding: 0 12px;
            font-size: 13px;
            font-weight: 800;
            text-decoration: none;
        }

        .page-link {
            border: 1px solid var(--line);
            background: var(--surface);
            color: #344054;
        }

        .page-current {
            background: var(--primary-soft);
            color: var(--primary);
        }

        .page-link.disabled {
            color: #98a2b3;
            pointer-events: none;
        }

        @media (max-width: 860px) {
            .shell {
                grid-template-columns: 1fr;
            }

            aside {
                padding: 18px;
            }

            nav {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            nav a {
                justify-content: center;
            }

            .content {
                padding: 20px 14px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .table-panel {
                overflow-x: auto;
            }

            table {
                min-width: 760px;
            }
        }
    </style>
</head>
<body>
<div class="shell">
    <aside>
        <div class="brand">Stomap Admin</div>
        <nav aria-label="관리자 메뉴">
            <a class="active" th:href="@{/members}">회원 관리</a>
            <a th:href="@{/reports}">신고 관리</a>
            <a th:href="@{/admin-members}">관리자 계정</a>
        </nav>
    </aside>

    <main class="content">
        <div class="topbar">
            <div>
                <h1>회원 관리</h1>
                <div class="summary">
                    전체 <strong th:text="${membersPage.totalElements}">0</strong>명
                </div>
            </div>

            <form method="post" th:action="@{/logout}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="logout" type="submit">로그아웃</button>
            </form>
        </div>

        <section class="table-panel" aria-labelledby="members-heading">
            <table th:if="${!membersPage.empty}">
                <thead>
                <tr>
                    <th scope="col">회원</th>
                    <th scope="col">이메일</th>
                    <th scope="col">가입 방식</th>
                    <th scope="col">상태</th>
                    <th scope="col">가입일</th>
                    <th scope="col">수정일</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="member : ${membersPage.content}">
                    <td>
                        <div class="member-main">
                            <span class="member-name" th:text="${member.nickname ?: member.name ?: '-'}">스토맵유저</span>
                            <span class="member-meta" th:text="|ID ${member.id ?: '-'}|">ID 1</span>
                        </div>
                    </td>
                    <td th:text="${member.email}">user@unimal.co.kr</td>
                    <td th:text="${member.provider ?: '-'}">MANUAL</td>
                    <td>
                        <span class="status"
                              th:classappend="${member.status.name()}"
                              th:text="${member.status.description}">활성화</span>
                    </td>
                    <td th:text="${member.createdAt != null ? #temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                    <td th:text="${member.updatedAt != null ? #temporals.format(member.updatedAt, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                </tr>
                </tbody>
            </table>

            <div class="empty" th:if="${membersPage.empty}">조회된 회원이 없습니다.</div>

            <div class="pagination">
                <a class="page-link"
                   th:classappend="${membersPage.first} ? 'disabled'"
                   th:href="@{/members(page=${membersPage.number - 1}, size=${size})}">이전</a>
                <span class="page-current"
                      th:text="|${membersPage.number + 1} / ${membersPage.totalPages == 0 ? 1 : membersPage.totalPages}|">1 / 1</span>
                <a class="page-link"
                   th:classappend="${membersPage.last} ? 'disabled'"
                   th:href="@{/members(page=${membersPage.number + 1}, size=${size})}">다음</a>
            </div>
        </section>
    </main>
</div>
</body>
</html>
