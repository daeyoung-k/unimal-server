<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stomap Admin Login</title>
    <!--
      로그인 화면은 사이드바가 없어 fragments/layout 의 head 를 쓰지 않는다.
      공통 CSS 는 색·폰트 변수를 얻으려고 그대로 링크한다.

      이 페이지는 인증 전에 열리므로 SecurityConfig 에서 /css/** 가 permitAll
      이어야 스타일이 적용된다.
    -->
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        body {
            display: grid;
            place-items: center;
            background: #f4f6f8;
        }

        main {
            width: min(400px, calc(100vw - 32px));
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            padding: 28px;
            box-shadow: 0 12px 32px rgba(16, 24, 40, .08);
        }

        h1 {
            font-size: 24px;
        }

        .subtitle {
            margin: 8px 0 24px;
            color: var(--muted);
            font-size: 14px;
        }

        /* 로그인 폼은 라벨이 입력 위에 붙는 세로 배치라 공통 규칙과 다르다. */
        label {
            display: block;
            margin: 16px 0 6px;
            color: #344054;
            font-size: 13px;
            font-weight: 600;
        }

        input {
            height: 42px;
            padding: 0 12px;
            font-size: 15px;
        }

        button {
            width: 100%;
            height: 44px;
            margin-top: 22px;
            border: 0;
            border-radius: 6px;
            background: #1d4ed8;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .message {
            margin-top: 16px;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
        }

        .message.error {
            background: #fef3f2;
            color: var(--danger);
        }

        .message.info {
            background: #eff6ff;
            color: #1e40af;
        }
    </style>
</head>
<body>
<main>
    <h1>Stomap Admin</h1>
    <p class="subtitle">관리자 계정으로 로그인하세요.</p>

    <form method="post" th:action="@{/login}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <label for="username">아이디</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>

        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">로그인</button>
    </form>

    <div class="message error" th:if="${param.error}">아이디 또는 비밀번호를 확인해주세요.</div>
    <div class="message info" th:if="${param.logout}">로그아웃되었습니다.</div>
    <div class="message info" th:if="${param.expired}">세션이 만료되었습니다. 다시 로그인해주세요.</div>
</main>
</body>
</html>
