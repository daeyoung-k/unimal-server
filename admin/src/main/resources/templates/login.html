<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stomap Admin Login</title>
    <style>
        :root {
            --bg: #f4f6f8;
            --panel: #ffffff;
            --text: #172033;
            --muted: #667085;
            --line: #d9e0ea;
            --primary: #1d4ed8;
            --danger: #b42318;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(400px, calc(100vw - 32px));
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 28px;
            box-shadow: 0 12px 32px rgba(16, 24, 40, .08);
        }

        h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 0;
        }

        .subtitle {
            margin: 8px 0 24px;
            color: var(--muted);
            font-size: 14px;
        }

        label {
            display: block;
            margin: 16px 0 6px;
            color: #344054;
            font-size: 13px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 42px;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 0 12px;
            font-size: 15px;
        }

        button {
            width: 100%;
            height: 44px;
            margin-top: 22px;
            border: 0;
            border-radius: 6px;
            background: var(--primary);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .message {
            margin-top: 16px;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
        }

        .message.error {
            background: #fef3f2;
            color: var(--danger);
        }

        .message.info {
            background: #eff6ff;
            color: #1e40af;
        }
    </style>
</head>
<body>
<main>
    <h1>Stomap Admin</h1>
    <p class="subtitle">관리자 계정으로 로그인하세요.</p>

    <form method="post" th:action="@{/login}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <label for="username">아이디</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>

        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">로그인</button>
    </form>

    <div class="message error" th:if="${param.error}">아이디 또는 비밀번호를 확인해주세요.</div>
    <div class="message info" th:if="${param.logout}">로그아웃되었습니다.</div>
    <div class="message info" th:if="${param.expired}">세션이 만료되었습니다. 다시 로그인해주세요.</div>
</main>
</body>
</html>
