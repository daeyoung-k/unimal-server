<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('공지 관리 · Stomap Admin', ~{::style})}">
    <style>
        /* 숨긴 공지는 눌러서 확인하지 않아도 목록에서 바로 구분돼야 한다. */
        tr.hidden-row td {
            background: #fcfcfd;
            color: var(--muted);
        }

        .notice-main {
            display: grid;
            gap: 3px;
        }

        .notice-title {
            color: #101828;
            font-weight: 800;
        }

        .notice-excerpt {
            display: -webkit-box;
            overflow: hidden;
            max-width: 520px;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 1;
            color: var(--muted);
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="shell">
    <th:block th:replace="~{fragments/layout :: sidebar('notices')}"></th:block>

    <main class="content">
        <div class="topbar">
            <div>
                <h1>공지 관리</h1>
                <div class="summary">
                    <span>전체 <strong th:text="${noticesPage.totalElements}">0</strong>건</span>
                    <span>숨김 <strong th:text="${hiddenCount}">0</strong>건</span>
                </div>
            </div>
            <a class="primary-action" th:href="@{/notices/new}">공지 작성</a>
        </div>

        <section class="table-panel">
            <form class="filters" method="get" th:action="@{/notices}">
                <input type="hidden" name="size" th:value="${size}">

                <div class="field">
                    <label for="keyword">검색</label>
                    <input id="keyword"
                           name="keyword"
                           type="search"
                           placeholder="제목, 내용"
                           th:value="${filter.keyword}">
                </div>

                <div class="field">
                    <label for="type">분류</label>
                    <select id="type" name="type">
                        <option value="" th:selected="${filter.type == null}">전체</option>
                        <option th:each="typeOption : ${types}"
                                th:value="${typeOption.name()}"
                                th:text="${typeOption.description}"
                                th:selected="${filter.type == typeOption}">일반 공지</option>
                    </select>
                </div>

                <div class="field">
                    <label for="show">노출</label>
                    <select id="show" name="show">
                        <option value="" th:selected="${filter.show == null}">전체</option>
                        <option value="true" th:selected="${filter.show == true}">노출중</option>
                        <option value="false" th:selected="${filter.show == false}">숨김</option>
                    </select>
                </div>

                <div class="field">
                    <label for="sort">정렬</label>
                    <select id="sort" name="sort">
                        <option th:each="sortOption : ${sortOptions}"
                                th:value="${sortOption.parameterName}"
                                th:text="${sortOption.label}"
                                th:selected="${filter.sort == sortOption}">최신순</option>
                    </select>
                </div>

                <button class="filter-action" type="submit">검색</button>
                <a class="filter-reset" th:href="@{/notices(size=${size})}">초기화</a>
            </form>

            <table>
                <thead>
                <tr>
                    <th scope="col">제목</th>
                    <th scope="col">분류</th>
                    <th scope="col">노출</th>
                    <th scope="col">작성일</th>
                    <th scope="col">수정일</th>
                    <th scope="col">관리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="notice : ${noticesPage.content}"
                    th:classappend="${!notice.show} ? 'hidden-row'">
                    <td>
                        <div class="notice-main">
                            <span class="notice-title" th:text="${notice.title}">공지 제목</span>
                            <span class="notice-excerpt" th:text="${notice.content}">본문 미리보기</span>
                        </div>
                    </td>
                    <td>
                        <span class="badge type" th:text="${notice.type.description}">일반 공지</span>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${notice.show} ? 'shown' : 'hidden'"
                              th:text="${notice.show} ? '노출중' : '숨김'">노출중</span>
                    </td>
                    <td th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd HH:mm')}">-</td>
                    <td th:text="${notice.updatedAt != null ? #temporals.format(notice.updatedAt, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                    <td>
                        <div class="row-actions">
                            <a class="page-link"
                               th:href="@{/notices/{id}/edit(id=${notice.id})}">수정</a>

                            <form th:if="${notice.show}"
                                  method="post"
                                  th:action="@{/notices/{id}/hide(id=${notice.id})}"
                                  onsubmit="return confirm('이 공지를 앱에서 숨길까요? 나중에 다시 노출할 수 있습니다.');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="row-button danger" type="submit">숨기기</button>
                            </form>

                            <form th:unless="${notice.show}"
                                  method="post"
                                  th:action="@{/notices/{id}/restore(id=${notice.id})}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="row-button" type="submit">복구</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>

            <div class="empty" th:if="${noticesPage.empty}">조회된 공지가 없습니다.</div>

            <div class="pagination">
                <a class="page-link"
                   th:classappend="${noticesPage.first} ? 'disabled'"
                   th:href="@{/notices(page=${noticesPage.number - 1}, size=${size}, type=${filter.type != null ? filter.type.name() : ''}, show=${filter.show != null ? filter.show : ''}, keyword=${filter.keyword}, sort=${filter.sort.parameterName})}">이전</a>
                <span class="page-current"
                      th:text="|${noticesPage.number + 1} / ${noticesPage.totalPages == 0 ? 1 : noticesPage.totalPages}|">1 / 1</span>
                <a class="page-link"
                   th:classappend="${noticesPage.last} ? 'disabled'"
                   th:href="@{/notices(page=${noticesPage.number + 1}, size=${size}, type=${filter.type != null ? filter.type.name() : ''}, show=${filter.show != null ? filter.show : ''}, keyword=${filter.keyword}, sort=${filter.sort.parameterName})}">다음</a>
            </div>
        </section>
    </main>
</div>
</body>
</html>
