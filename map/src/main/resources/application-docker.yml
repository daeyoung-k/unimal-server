server:
  port: ${MAP_SERVICE_PORT}
  servlet:
    context-path: /map

spring:
  config:
    activate:
      on-profile: docker
  application:
    name: map-server

  jackson:
    time-zone: Asia/Seoul

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database: postgresql
    defer-datasource-initialization: true
    properties:
      hibernate:
        default_schema: ${DATABASE_MAP_SCHEMA}

  sql:
    init:
      mode: always
      continue-on-error: true

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DATABASE_DOCKER_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    dbcp2:
      default-schema: ${DATABASE_MAP_SCHEMA}

  data:
    redis:
      host: ${REDIS_DOCKER_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

grpc:
  server:
    port: ${MAP_SERVICE_GRPC_PORT}
    enable-keep-alive: true
    keep-alive-time: 60s
    keep-alive-timeout: 30s

custom:
  data:
    map:
      api-key: ${GOOGLE_GEOCODING_API_KEY}
    # 장소 검색 — 앱 .env 에 박혀 있던 네이버 키를 서버로 옮긴 것.
    # naver: 네이버 개발자센터 오픈API(지역검색) / ncp: 네이버 클라우드(지오코딩, 종량 과금)
    search:
      # 빈 기본값(:)을 둔다. 환경변수가 없으면 빈 문자열로 뜨고 장소검색만 결과 0건이
      # 된다. 기본값이 없으면 빈 컨텍스트로 죽어 역지오코딩까지 멈추고, 그러면
      # 게시글 작성 자체가 막힌다 — 부가 기능 하나로 핵심 기능을 인질 잡을 이유가 없다.
      naver:
        client-id: ${NAVER_SEARCH_CLIENT_ID:}
        client-secret: ${NAVER_SEARCH_CLIENT_SECRET:}
      ncp:
        api-key-id: ${NAVER_CLOUD_MAP_CLIENT_ID:}
        api-key: ${NAVER_CLOUD_MAP_CLIENT_SECRET:}