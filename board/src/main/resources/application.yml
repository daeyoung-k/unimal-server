server:
  port: ${BOARD_SERVICE_PORT}
  servlet:
    context-path: /board

spring:
  main:
    allow-bean-definition-overriding: true
  config:
    activate:
      on-profile: local
  application:
    name: board-server
  servlet:
    multipart:
      max-file-size: 30MB

  jackson:
    time-zone: Asia/Seoul
    deserialization:
      fail-on-unknown-properties: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database: postgresql
    defer-datasource-initialization: true
    properties:
      hibernate:
        default_schema: ${DATABASE_BOARD_SCHEMA}

  sql:
    init:
      mode: always
      continue-on-error: true

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    dbcp2:
      default-schema: ${DATABASE_BOARD_SCHEMA}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics,prometheus
    metrics:
      export:
        prometheus:
          enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_SERVER_1},${KAFKA_SERVER_2},${KAFKA_SERVER_3}

    consumer:
      group-id: unimal-board-group
      auto-offset-reset: latest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      missing-topics-fatal: false

grpc:
  client:
    map-grpc:
      address: static://localhost:${MAP_SERVICE_GRPC_PORT}
      negotiation-type: plaintext
    photo-grpc:
      address: static://localhost:${PHOTO_SERVICE_GRPC_PORT}
      negotiation-type: plaintext


etc:
  base-url:
    photo: http://${BASE_URI}:${API_GATEWAY_SERVICE_PORT}
  files:
    base-url: ${AWS_CLOUDFRONT_DOMAIN}

# 게시글 공유 (docs/specs/2026-08-07-게시글-공유.md)
#
# base-url 은 앱에 하드코딩하지 않고 API 응답(shareUrl)으로 내려준다.
# 앱은 배포하면 못 고치므로, 도메인이 바뀌면 서버 배포 한 번으로 끝나야 한다.
custom:
  share:
    base-url: ${SHARE_BASE_URL:https://stomap.unimal.co.kr}
    # 앱 딥링크 커스텀 스킴. AndroidManifest / Info.plist 등록값과 반드시 같아야 한다.
    scheme: ${SHARE_APP_SCHEME:stomap}
    store:
      android: ${SHARE_STORE_ANDROID:https://play.google.com/store/apps/details?id=com.unimal.android.stomap}
      # App Store 숫자 ID 발급 후 채운다. 비워두면 iOS 미설치 사용자가 갈 곳이 없다.
      ios: ${SHARE_STORE_IOS:https://apps.apple.com/kr/app/stomap/id0000000000}
    # 사진 없는 글의 og:image 폴백. 없으면 카톡 카드가 텍스트만 남는다.
    default-image: ${SHARE_DEFAULT_IMAGE:${AWS_CLOUDFRONT_DOMAIN}/static/share-default.png}